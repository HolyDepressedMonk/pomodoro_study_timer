<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Pomodoro Timer</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>

    <h2>Pomodoro Timer</h2>

    <h3 id="mode">Study</h3>
    <p id="timerStatus"></p>
    <h1 id="timer">25:00</h1>

    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
    </div>

    <hr>

    <div class="settings">

        <label for="studyTime">
            Study Time (minutes)
        </label>

        <input
            type="number"
            id="studyTime"
            min="1"
            max="180"
            value="25">

        <label for="breakTime">
            Break Time (minutes)
        </label>

        <input
            type="number"
            id="breakTime"
            min="1"
            max="180"
            value="5">

        <button id="saveBtn">
            Save Settings
        </button>
        <p id="settingsStatus"></p>

    </div>

    <script src="popup.js"></script>

</body>
</html>
